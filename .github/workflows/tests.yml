name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Python 3.12 x64 + PySide6 (desarrollo)"
            python: "3.12"
            arch: x64
          - name: "Python 3.8 x86 + PySide2 (build publicado)"
            python: "3.8"
            arch: x86
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
