name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Resolver versión
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python -c "import fluo; print(fluo.__version__)")
          fi
          code_version=$(python -c "import fluo; print(fluo.__version__)")
          if [[ "$version" != "$code_version" ]]; then
            echo "::error::El tag ($version) no coincide con fluo/__init__.py ($code_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: PyInstaller (onedir)
        run: pyinstaller fluo.spec --noconfirm --clean

      - name: Humo del ejecutable
        shell: pwsh
        run: |
          $exe = "dist/Fluo/Fluo.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Fluo.exe se cerró solo con código $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist/Fluo/* -DestinationPath "dist/Fluo-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\fluo.iss

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Fluo ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Fluo-Setup-*.exe
            dist/Fluo-*-portable.zip
            scripts/Instalar.bat

      - name: Guardar artefactos (sin tag)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: fluo-${{ steps.ver.outputs.version }}
          path: |
            dist/Fluo-Setup-*.exe
            dist/Fluo-*-portable.zip
