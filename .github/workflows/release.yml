name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Build universal de 32 bits con Python 3.8 + PySide2 (Qt 5): corre en
      # Windows 7 SP1, 8, 8.1, 10 y 11, tanto de 32 como de 64 bits.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Resolver versión
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python -c "import fluo; print(fluo.__version__)")
          fi
          code_version=$(python -c "import fluo; print(fluo.__version__)")
          if [[ "$version" != "$code_version" ]]; then
            echo "::error::El tag ($version) no coincide con fluo/__init__.py ($code_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: PyInstaller (onedir, 32 bits)
        run: python -m PyInstaller fluo.spec --noconfirm --clean

      - name: Humo del ejecutable
        shell: pwsh
        run: |
          $exe = "dist/Fluo/Fluo.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          $log = Join-Path $env:LOCALAPPDATA "Fluo/fluo.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError smoke_err.txt
          Start-Sleep -Seconds 12
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if ((Test-Path smoke_err.txt) -and (Select-String -Path smoke_err.txt -Pattern "Traceback" -Quiet)) {
            Get-Content smoke_err.txt
            throw "Fluo.exe tiró una excepción al arrancar"
          }
          if (-not $alive) { throw "Fluo.exe se cerró solo con código $($p.ExitCode)" }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "arranc" -Quiet)) {
            throw "Fluo.exe no llegó a abrir la ventana (no hay línea de arranque en el log)"
          }
          Get-Content $log

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path dist/Fluo/* -DestinationPath "dist/Fluo-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\fluo.iss

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Fluo ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Fluo-Setup-*.exe
            dist/Fluo-*-portable.zip
            scripts/Instalar.bat

      - name: Guardar artefactos (sin tag)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: fluo-${{ steps.ver.outputs.version }}
          path: |
            dist/Fluo-Setup-*.exe
            dist/Fluo-*-portable.zip
